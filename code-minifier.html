<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Minifier & Formatter - DevTools Hub PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white text-sm transition">&larr; Back to Hub</a>
        <h1 class="text-lg font-bold text-indigo-600 dark:text-indigo-400 hidden sm:block">Code Minifier & Formatter</h1>
      </div>
      <button id="themeToggle" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 p-2 rounded-xl text-sm border border-slate-300 dark:border-slate-700">☀️</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-md space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Input Source Code</span>
        <div class="flex items-center gap-2">
          <button id="btnMinify" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow-md shadow-indigo-500/20">⚡ Minify Code</button>
          <button id="btnClear" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-700 dark:text-slate-300 text-xs font-semibold px-3 py-2 rounded-xl transition">Clear</button>
        </div>
      </div>
      <textarea id="codeInput" rows="8" placeholder="Paste your raw HTML, CSS, or JavaScript code here..." class="w-full p-4 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl font-mono text-xs sm:text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-md space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Minified Output</span>
        <button id="btnCopy" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow-md">📋 Copy Output</button>
      </div>
      <textarea id="codeOutput" rows="8" readonly placeholder="Minified code will appear here..." class="w-full p-4 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl font-mono text-xs sm:text-sm text-emerald-600 dark:text-emerald-400 focus:outline-none"></textarea>
    </div>
  </main>

  <div id="toast" class="fixed bottom-6 right-6 bg-slate-950 text-white px-4 py-3 rounded-xl border border-slate-700 shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 text-sm">✅ Copied to clipboard!</div>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      themeToggle.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    });

    const codeInput = document.getElementById('codeInput');
    const codeOutput = document.getElementById('codeOutput');
    const toast = document.getElementById('toast');

    document.getElementById('btnMinify').addEventListener('click', () => {
      const code = codeInput.value;
      if (!code.trim()) return;
      // Removes multi-line/single-line comments & extra spaces
      const minified = code.replace(/\/\*[\s\S]*?\*\/|\/\/.*/g, '').replace(/\s+/g, ' ').trim();
      codeOutput.value = minified;
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      codeInput.value = '';
      codeOutput.value = '';
    });

    document.getElementById('btnCopy').addEventListener('click', () => {
      if (!codeOutput.value) return;
      navigator.clipboard.writeText(codeOutput.value);
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2000);
    });
  </script>
</body>
</html>
