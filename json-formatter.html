<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online JSON Formatter & Validator - Dev Tools Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header / Navbar -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-slate-400 hover:text-white transition text-sm">&larr; Back to Hub</a>
        <h1 class="text-xl font-bold tracking-wide text-indigo-400 hidden sm:block">
          &lt;DevTools/&gt; <span class="text-white text-base font-normal">| JSON Formatter</span>
        </h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs bg-indigo-500/10 text-indigo-400 px-3 py-1 rounded-full border border-indigo-500/20 hidden md:inline-block">
          100% Client-Side
        </span>
        <!-- Theme Toggle -->
        <button id="themeToggle" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg transition text-sm flex items-center justify-center w-9 h-9 border border-slate-700">
          ☀️
        </button>
      </div>
    </div>
  </header>

  <!-- Main Work Area -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- Action Controls Toolbar -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4 bg-slate-950 p-3 rounded-xl border border-slate-800 shadow-sm">
      <div class="flex flex-wrap items-center gap-2">
        <button id="btnFormat" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg transition text-sm flex items-center gap-1.5 shadow-sm">
          <span>✨ Format JSON</span>
        </button>
        <button id="btnMinify" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-4 py-2 rounded-lg transition text-sm border border-slate-700">
          Compact / Minify
        </button>
        <button id="btnClear" class="bg-red-500/10 text-red-400 hover:bg-red-500/20 border border-red-500/20 px-3 py-2 rounded-lg transition text-sm">
          Clear
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button id="btnCopy" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg transition text-sm shadow-sm">
          📋 Copy Output
        </button>
      </div>
    </div>

    <!-- Status Alert Bar -->
    <div id="statusBox" class="hidden mb-4 p-3 rounded-lg text-sm font-mono border"></div>

    <!-- Dual Editor Columns -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-[550px]">
      
      <!-- Input Column -->
      <div class="flex flex-col h-full bg-slate-950 rounded-xl border border-slate-800 shadow-sm overflow-hidden">
        <div class="bg-slate-900/60 px-4 py-2.5 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800 flex justify-between">
          <span>Input Raw JSON</span>
          <span id="inputCharCount" class="text-slate-500 font-mono">0 chars</span>
        </div>
        <textarea id="jsonInput" placeholder='Paste your unformatted JSON here... e.g. {"name":"Musharib","role":"Developer"}' class="w-full flex-grow p-4 bg-transparent font-mono text-sm text-slate-200 resize-none focus:outline-none"></textarea>
      </div>

      <!-- Output Column -->
      <div class="flex flex-col h-full bg-slate-950 rounded-xl border border-slate-800 shadow-sm overflow-hidden">
        <div class="bg-slate-900/60 px-4 py-2.5 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800 flex justify-between">
          <span>Formatted Output</span>
          <span id="outputCharCount" class="text-slate-500 font-mono">0 chars</span>
        </div>
        <textarea id="jsonOutput" readonly placeholder="Result will appear here..." class="w-full flex-grow p-4 bg-transparent font-mono text-sm text-emerald-400 dark:text-emerald-400 resize-none focus:outline-none cursor-text"></textarea>
      </div>

    </div>

    <!-- SEO Content Section -->
    <section class="mt-12 border-t border-slate-800 pt-8 text-slate-400 space-y-4">
      <h2 class="text-lg font-semibold text-white">Free Online
